  learned:
    patterns:
      - "Assigning to a local variable named 'html' inside a function shadows 'import html' across the entire function scope in Python, leading to UnboundLocalError. Use 'import html as html_lib' to avoid namespace collision."
      - "Pathlib's Path(x).name treats forward slashes as directory separators, so input containing tags with slashes like '<script>alert(1)</script>' gets split if treated as a path; escaping raw title strings before Path parsing or escaping custom titles directly is essential."
      - "Hatch sdist target exclusions must use leading slashes ('/.agent', '/AGENTS.md') to match root-level directories while leaving nested files like 'tests/generate_fixtures.py' intact when excluding 'tests/fixtures'."
